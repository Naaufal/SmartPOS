{% extends 'base.html' %}
{% block content %}
<div class="mb-3">
    <h2 class="fw-bold mb-1">Kategori</h2>
    <p class="text-muted mb-0">Kelola kategori produk SmartPOS.</p>
</div>

<div class="row g-4">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-plus-circle me-2"></i>Tambah Kategori
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('kategori_tambah') }}">
                    <div class="mb-3">
                        <label for="nama-kategori-baru" class="form-label fw-semibold">Nama Kategori</label>
                        <input id="nama-kategori-baru" name="nama_kategori" class="form-control" placeholder="Contoh: Kopi Dingin" required>
                    </div>
                    <button class="btn btn-primary w-100">
                        <i class="bi bi-plus-lg me-1"></i> Tambah Kategori
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-tags me-2"></i>Daftar Kategori
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Nama Kategori</th>
                            <th class="text-center">Jumlah Produk</th>
                            <th class="text-end">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for c in categories %}
                        <tr>
                            <td>
                                <form class="d-flex gap-2" method="post" action="{{ url_for('kategori_edit', category_id=c.id) }}">
                                    <input name="nama_kategori" class="form-control form-control-sm" value="{{ c.nama_kategori }}" aria-label="Nama kategori" required>
                                    <button class="btn btn-sm btn-outline-primary text-nowrap">Simpan</button>
                                </form>
                            </td>
                            <td class="text-center font-mono-num">
                                <span class="badge rounded-pill" style="background-color: var(--cr-sand); color: var(--cr-roast);">{{ c.jumlah_produk }}</span>
                            </td>
                            <td class="text-end">
                                <form method="post" action="{{ url_for('kategori_hapus', category_id=c.id) }}" onsubmit="return confirm('Hapus kategori {{ c.nama_kategori }}?')">
                                    <button class="btn btn-sm btn-outline-danger">Hapus</button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3">
                                <div class="empty-state">
                                    <i class="bi bi-tags"></i>
                                    <span>Belum ada kategori terdaftar.</span>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
